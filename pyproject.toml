[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-gui"
version = "0.1.0"
description = "Gradio and FastAPI interface for SAM 3.1 Object Multiplex segmentation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio==6.20.0",
    "imageio==2.37.2",
    "imageio-ffmpeg==0.6.0",
    "loguru==0.7.3",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "python-multipart==0.0.32",
    "numpy>=1.26,<2",
    "torch",
    "opencv-python-headless",
    "pillow==12.3.0",
    "pycocotools==2.0.11",
    "matplotlib",
    "huggingface_hub",
    "modelscope",
    "hydra-core>=1.3,<1.4",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "pytest>=9,<10",
    "ruff>=0.12",
    "twine>=6",
]

[project.scripts]
sam3-gui = "sam3_gui.cli:main"

[tool.setuptools.packages.find]
include = ["sam3_gui*", "tools*"]

[tool.setuptools.package-data]
sam3_gui = ["conf/*.yaml", "conf/*/*.yaml"]
