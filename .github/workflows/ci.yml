name: CI

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install project
        run: python -m pip install -e ".[test]"
      - name: Static checks
        run: |
          ruff check cli.py sam3_gui tools tests download_model.py
          ruff format --check cli.py sam3_gui tools tests download_model.py
      - name: Offline tests
        run: python -m pytest -q -m "not integration"
      - name: Build distributions
        run: |
          python -m build
          python -m twine check dist/*
      - name: Wheel entrypoint smoke
        run: |
          python -m venv /tmp/sam3-gui-wheel
          /tmp/sam3-gui-wheel/bin/python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          /tmp/sam3-gui-wheel/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/sam3-gui-wheel/bin/sam3-gui --help
